name: Selftest (non-LLM)

# ロードマップ「CI/CD統合」の第一段階（AGENTS.md §4 長期）。
# 実LLM API・実ネットワーク(scanme.nmap.org等)を要求するテストは秘密情報が無いと動かせない
# ため、CIでは tools/run_selftest.py の非LLM項目（1〜8・2b〜2d）のみを SELFTEST_NON_LLM_ONLY=1
# で実行する。実LLM込みのフル回帰は開発者がローカルで CLAUDE.md の「開発ループ」に従って行う。
#
# このワークフローはリポジトリに追加されただけでは実行されない — GitHubにpushして
# 初めて有効になる（ローカルのgit historyにコミットされているだけの間は無効）。

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  selftest-non-llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run non-LLM selftest (1-8, 2b-2d)
        env:
          SELFTEST_NON_LLM_ONLY: "1"
        run: python tools/run_selftest.py
